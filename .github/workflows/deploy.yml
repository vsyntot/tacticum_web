name: 🚀 Deploy to tacticum.ru

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────
  # 1. Линтинг PHP
  # ──────────────────────────────────────────
  lint:
    name: 🔍 PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Check PHP syntax — local/ and public PHP
        run: |
          find local/ -name "*.php" -print0 | xargs -0 -n1 php -d short_open_tag=1 -l
          find . -maxdepth 1 -name "*.php" -print0 | xargs -0 -n1 php -d short_open_tag=1 -l
          find about services contacts calculator price offer aiagents policies platform agents dev forum -name "*.php" -print0 | xargs -0 -n1 php -d short_open_tag=1 -l

  # ──────────────────────────────────────────
  # 2. Деплой
  # ──────────────────────────────────────────
  deploy:
    name: 📦 Deploy via rsync
    runs-on: ubuntu-latest
    needs: lint
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js for deploy tooling
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync local/ (кастомный код)
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.log' \
            --exclude='local/php_interface/include/tacticum_config.php' \
            ./local/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/local/

      - name: Sync публичные разделы сайта
        run: |
          rsync -avz --delete --relative \
            --exclude='.git' \
            ./about/ ./services/ ./contacts/ ./calculator/ \
            ./price/ ./offer/ ./aiagents/ ./policies/ \
            ./platform/ ./agents/ ./dev/ ./forum/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Sync корневые файлы
        run: |
          STATIC_SITEMAP_LASTMOD="$(TZ=Europe/Moscow date +%F)"
          node ./tools/static-sitemap-generate.mjs --output=sitemap-basic-files.xml --lastmod="$STATIC_SITEMAP_LASTMOD"
          node ./tools/static-sitemap-generate.mjs --output=sitemap-basic-files.xml --lastmod="$STATIC_SITEMAP_LASTMOD" --check
          rsync -avz \
            index.php 404.php robots.txt sitemap.xml sitemap-basic-files.xml urlrewrite.php \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Remove legacy sitemap artifact
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "rm -f ${{ secrets.DEPLOY_PATH }}/sitemap-files.xml"

      - name: Очистка Bitrix cache
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/managed_cache/* 2>/dev/null || true; \
             rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/cache/tacticum 2>/dev/null || true; \
             rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/cache/s1/bitrix/menu/* 2>/dev/null || true; \
             rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/cache/s1/bitrix/news.list/* 2>/dev/null || true; \
             rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/cache/s1/bitrix/news.detail/* 2>/dev/null || true; \
             rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/html_pages/* 2>/dev/null || true; \
             rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/cache/css/s1/tacticum/* 2>/dev/null || true; \
             rm -rf ${{ secrets.DEPLOY_PATH }}/bitrix/cache/js/s1/tacticum/* 2>/dev/null || true; \
             echo 'Cache cleared'"

      - name: Smoke config health
        run: |
          curl --fail --show-error --silent --location \
            --max-time 20 \
            --output /tmp/tacticum-health-config.json \
            "https://tacticum.ru/local/rest/health_config.php"
          grep -q '"success":true' /tmp/tacticum-health-config.json

      - name: Setup Node.js for post-deploy smoke
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install smoke tooling
        run: npm ci

      - name: Check release lifecycle guard
        run: |
          npm run js:check
          npm run css:check
          npm run css:syntax
          npm run template-styles:check
          npm run config:check
          npm run seo:check
          npm run bitrix:check
          npm run component:states:check
          npm run product:content:safety:check
          npm run product:challenge:check
          npm run sale:sunset:check
          npm run gaps:known
          npm run release:signoff:draft-check -- docs/workflow/release-signoff-2026-06-01-product-first.draft.json
          npm run release:signoff:self-test

      - name: Post-deploy visual smoke
        env:
          TACTICUM_VISUAL_BASE_URL: https://tacticum.ru
          TACTICUM_EXPECT_SEO_HEAD: "1"
        run: npm run visual:smoke

      - name: Post-deploy browser action smoke
        env:
          TACTICUM_VISUAL_BASE_URL: https://tacticum.ru
          TACTICUM_VISUAL_ACTIONS: "1"
          TACTICUM_VISUAL_FAIL_ON_WARNINGS: "1"
          TACTICUM_EXPECT_PRICE_TEAM_PRESETS: "1"
        run: npm run browser:console

      - name: Post-deploy price team preset smoke
        run: npm run browser:smoke:price

      - name: Post-deploy SEO endpoint smoke
        run: npm run seo:check:prod

      - name: ✅ Deploy success
        if: success()
        run: echo "Deploy to tacticum.ru completed at $(date)"

      - name: ❌ Deploy failed
        if: failure()
        run: echo "Deploy FAILED. Check logs above."

name: 🔎 PR Check

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  php-lint:
    name: 🔍 PHP 8.4 Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Проверка синтаксиса — local/ и публичные PHP
        run: |
          find local/ -name "*.php" -print0 | xargs -0 -n1 php -d short_open_tag=1 -l
          find . -maxdepth 1 -name "*.php" -print0 | xargs -0 -n1 php -d short_open_tag=1 -l
          find about services contacts calculator price offer aiagents policies platform agents dev forum -name "*.php" -print0 | xargs -0 -n1 php -d short_open_tag=1 -l

  css-build:
    name: 🎨 Static CSS Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend tooling
        run: npm ci

      - name: Check generated Tailwind CSS
        run: |
          npm run js:check
          npm run css:check
          npm run css:syntax

      - name: Check template styles retirement
        run: npm run template-styles:check

      - name: Check browser smoke tool syntax
        run: |
          node --check tools/visual-smoke.mjs
          node --check tools/seo-check.mjs
          node --check tools/js-syntax-check.mjs
          node --check tools/css-syntax-check.mjs

      - name: Check config and lifecycle tooling
        run: |
          node --check tools/dev-env-preflight.mjs
          node --check tools/template-styles-retirement-check.mjs
          node --check tools/release-signoff-check.mjs
          node --check tools/release-signoff-self-test.mjs
          node --check tools/config-contract-check.mjs
          node --check tools/legacy-sale-sunset-check.mjs
          node --check tools/bitrix-architecture-check.mjs
          node --check tools/product-content-schema-check.mjs
          node --check tools/product-content-target-evidence-check.mjs
          node --check tools/product-tech-challenge-board-check.mjs
          node --check tools/product-tech-challenge-approval-check.mjs
          node --check tools/product-tech-challenge-owner-status-check.mjs
          node --check tools/product-tech-challenge-issue-backlog-check.mjs
          npm run config:check
          npm run seo:check
          npm run bitrix:check
          npm run product:content:safety:check
          npm run product:challenge:check
          npm run sale:sunset:check
          npm run release:signoff:check -- docs/workflow/release-signoff.example.json
          npm run release:signoff:self-test

  security-checks:
    name: 🛡️ Security & Convention Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Blockers — runtime REST/API/php_interface conventions
        shell: bash
        run: |
          set +e
          FAIL=0
          RUNTIME_FILES=$(git diff origin/main...HEAD --name-only -- \
            'local/rest/*.php' \
            'local/api/*.php' \
            'local/php_interface/*.php' \
            'local/php_interface/include/*.php' \
            | grep -v '^local/rest/rest_helpers.php$' \
            | grep -v '^local/php_interface/include/tacticum_config.php$' \
            | while read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done)

          if [ -z "$RUNTIME_FILES" ]; then
            echo "✅ No changed runtime PHP files in REST/API/php_interface."
            exit 0
          fi

          echo "Changed runtime PHP files:"
          echo "$RUNTIME_FILES"

          RESULT=$(grep -nE "IBLOCK_ID[\"']?[[:space:]]*(=>|=)[[:space:]]*[0-9]+" $RUNTIME_FILES)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Hardcoded IBLOCK_ID detected in changed runtime files."
            echo "$RESULT"
            echo "Use tacticum_rest_get_iblock_id('key') instead."
            FAIL=1
          else
            echo "✅ No hardcoded IBLOCK_ID in changed runtime files."
          fi

          RESULT=$(grep -nE "['\"]http://|tacticum_rest_get_ai_setting[[:space:]]*\([^)]*['\"]http://|5\.35\.90\.193" $RUNTIME_FILES)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Hardcoded HTTP fallback or AI service host detected in changed runtime files."
            echo "$RESULT"
            echo "Use tacticum_rest_get_required_https_ai_url(...) or config helpers; production external requests must use HTTPS."
            FAIL=1
          else
            echo "✅ No hardcoded HTTP fallback or AI service host in changed runtime files."
          fi

          RESULT=$(grep -nE "curl_init[[:space:]]*\([[:space:]]*['\"]http://" $RUNTIME_FILES)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Plain HTTP used in curl_init()."
            echo "$RESULT"
            echo "External requests must use HTTPS."
            FAIL=1
          else
            echo "✅ No plain HTTP curl_init() calls."
          fi

          NEW_ENDPOINTS=$(git diff origin/main...HEAD --name-status -- 'local/rest/*.php' 'local/api/*.php' \
            | awk '$1 == "A" { print $2 }' \
            | grep -v '^local/rest/rest_helpers.php$')

          for f in $NEW_ENDPOINTS; do
            [ -f "$f" ] || continue

            if [ "${f#local/rest/}" != "$f" ]; then
              if ! grep -q "tacticum_rest_validate_origin" "$f"; then
                echo "❌ ERROR: $f missing tacticum_rest_validate_origin()"
                FAIL=1
              fi
              if ! grep -q "tacticum_rest_rate_limit" "$f"; then
                echo "❌ ERROR: $f missing tacticum_rest_rate_limit()"
                FAIL=1
              fi
              if ! grep -q "tacticum_rest_check_csrf" "$f"; then
                echo "❌ ERROR: $f missing tacticum_rest_check_csrf()"
                FAIL=1
              fi
              if ! grep -q "tacticum_rest_require_method('POST')" "$f" && ! grep -q 'tacticum_rest_require_method("POST")' "$f"; then
                echo "❌ ERROR: $f missing tacticum_rest_require_method('POST')."
                FAIL=1
              fi
              if ! grep -qE "tacticum_rest_read_json_body|json_decode" "$f"; then
                echo "❌ ERROR: $f missing JSON request parsing."
                FAIL=1
              fi
            fi

            if [ "${f#local/api/}" != "$f" ]; then
              if ! grep -q "tacticum_api_bootstrap" "$f"; then
                echo "❌ ERROR: $f missing tacticum_api_bootstrap()."
                FAIL=1
              fi
            fi
          done

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          else
            echo "✅ Runtime blocker checks passed."
          fi

      - name: Blockers — no file/debug logging in local and public scripts
        shell: bash
        run: |
          set +e
          FAIL=0
          SCRIPT_FILES=$(git diff origin/main...HEAD --name-only -- \
            'local/**/*.php' \
            'local/**/*.js' \
            '*.php' \
            'about/**/*.php' \
            'agents/**/*.php' \
            'aiagents/**/*.php' \
            'calculator/**/*.php' \
            'contacts/**/*.php' \
            'dev/**/*.php' \
            'forum/**/*.php' \
            'offer/**/*.php' \
            'platform/**/*.php' \
            'policies/**/*.php' \
            'price/**/*.php' \
            'services/**/*.php' \
            | while read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done)

          if [ -z "$SCRIPT_FILES" ]; then
            echo "✅ No changed local/public PHP or JS scripts."
            exit 0
          fi

          RESULT=$(grep -nE 'AddMessage2Log|file_put_contents|error_log|fopen[[:space:]]*\(|fwrite[[:space:]]*\(|syslog[[:space:]]*\(|openlog[[:space:]]*\(|Debug::writeToFile|dumpToFile|writeToFile|CEventLog::|console\.(log|error|warn)' $SCRIPT_FILES)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: File/debug logging is not allowed in /local or public scripts."
            echo "$RESULT"
            echo "Remove runtime log writes; do not log payloads/responses from custom site code."
            FAIL=1
          else
            echo "✅ No file/debug logging in changed local/public scripts."
          fi

          exit $FAIL

      - name: Warnings — public page hardcoded iblock IDs
        shell: bash
        run: |
          set +e
          PUBLIC_FILES=$(git diff origin/main...HEAD --name-only -- \
            '*.php' \
            ':!local/**' \
            ':!bitrix/**' \
            ':!docs/**' \
            | while read -r f; do [ -f "$f" ] && printf '%s\n' "$f"; done)

          if [ -z "$PUBLIC_FILES" ]; then
            echo "✅ No changed public PHP pages."
            exit 0
          fi

          RESULT=$(grep -nE "IBLOCK_ID[\"']?[[:space:]]*(=>|=)[[:space:]]*[0-9]+" $PUBLIC_FILES)
          if [ -n "$RESULT" ]; then
            echo "⚠️  WARNING: Hardcoded IBLOCK_ID detected in public pages outside current runtime scope."
            echo "$RESULT"
            echo "Keep this warning-level unless the page enters Sprint 01 runtime scope."
          else
            echo "✅ No public page hardcoded IBLOCK_ID warnings."
          fi

      - name: Blockers — repository and frontend conventions
        shell: bash
        run: |
          set +e
          FAIL=0

          RESULT=$(git ls-files -c -i --exclude-standard)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Tracked files are matched by .gitignore."
            echo "$RESULT"
            echo "Remove local/runtime files from Git index or update .gitignore intentionally."
            FAIL=1
          else
            echo "✅ No tracked ignored files."
          fi

          if [ -f "local/templates/tacticum/js/chat.js" ]; then
            echo "❌ ERROR: Legacy demo chat.js must not be restored."
            echo "Use local/templates/tacticum/js/chat-agent.js for production chat surfaces."
            FAIL=1
          else
            echo "✅ Legacy chat.js is absent."
          fi

          if [ -f "local/templates/tacticum/js/bundle.v3.4.16.js" ] || [ -f "local/templates/tacticum/js/init.js" ]; then
            echo "❌ ERROR: Legacy browser Tailwind JS artifacts must not be restored."
            echo "Use local/templates/tacticum/tailwind.generated.css built by npm run css:build."
            FAIL=1
          else
            echo "✅ Legacy browser Tailwind JS artifacts are absent."
          fi

          node tools/template-styles-retirement-check.mjs
          if [ "$?" -ne 0 ]; then
            FAIL=1
          fi

          RESULT=$(grep -nE 'tailwindcss v[0-9]|@layer[[:space:]]+(theme|base|utilities)' local/templates/tacticum/template_styles.css)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: template_styles.css must not contain generated Tailwind layers."
            echo "$RESULT"
            echo "Use local/templates/tacticum/tailwind.generated.css for generated utilities."
            FAIL=1
          else
            echo "✅ template_styles.css has no generated Tailwind layer block."
          fi

          RESULT=$(find local/templates/tacticum/styles -maxdepth 1 -type f ! -name 'global.css' -print)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Unused generated page CSS artifacts must not be restored."
            echo "$RESULT"
            echo "Use styles/global.css for manual template CSS or component CSS for isolated Bitrix components."
            FAIL=1
          else
            echo "✅ No stale generated page CSS artifacts; styles/global.css is the only approved template styles file."
          fi

          RESULT=$(grep -nE 'bundle\.v3\.4\.16\.js|js/init\.js' local/templates/tacticum/header.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Browser Tailwind runtime must not be loaded from header.php."
            echo "$RESULT"
            echo "Use local/templates/tacticum/tailwind.generated.css built by npm run css:build."
            FAIL=1
          elif ! grep -q 'tailwind.generated.css' local/templates/tacticum/header.php; then
            echo "❌ ERROR: header.php must load static tailwind.generated.css."
            FAIL=1
          elif ! grep -q 'styles/global.css' local/templates/tacticum/header.php; then
            echo "❌ ERROR: header.php must load migrated global styles through styles/global.css."
            FAIL=1
          else
            echo "✅ Static Tailwind CSS and migrated global styles are loaded without browser runtime."
          fi

          RESULT=$(grep -nE 'substr_count[[:space:]]*\(|GetCurPage[[:space:]]*\(|addString[[:space:]]*\(' local/templates/tacticum/header.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Header must not route optional assets by URL substring or raw addString script injection."
            echo "$RESULT"
            echo "Use explicit TACTICUM_PAGE_ASSETS flags and Asset::addJs/addCss."
            FAIL=1
          else
            echo "✅ Header optional asset routing checks passed."
          fi

          RESULT=$(grep -nE 'substr_count[[:space:]]*\(|GetCurPage[[:space:]]*\(' local/templates/tacticum/components/bitrix/news.list/faq/template.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: FAQ component must not change presentation by current URL."
            echo "$RESULT"
            echo "Pass explicit component params such as SECTION_CLASS instead."
            FAIL=1
          else
            echo "✅ FAQ presentation is parameter-driven."
          fi

          RESULT=$(grep -RInE --include='*.php' 'onclick=' index.php about services calculator contacts offer aiagents policies price platform agents dev forum local/components local/templates/tacticum)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Inline onclick handlers are not allowed in public/template markup."
            echo "$RESULT"
            echo "Use links for navigation or JS behavior bound by data-* attributes."
            FAIL=1
          else
            echo "✅ No inline onclick handlers in public/template markup."
          fi

          RESULT=$(grep -nE '<style|style=' local/templates/tacticum/components/bitrix/news.detail/policies/template.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Policies component styles must live in component style.css, not inline markup."
            echo "$RESULT"
            FAIL=1
          else
            echo "✅ Policies component has no inline style block."
          fi

          RESULT=$(grep -nE '<script' contacts/index.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Contacts page must not embed inline scripts."
            echo "$RESULT"
            echo "Use explicit TACTICUM_PAGE_ASSETS and template JS assets."
            FAIL=1
          else
            echo "✅ Contacts page has no inline script embeds."
          fi

          RESULT=$(grep -nE '<script' local/templates/tacticum/header.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: header.php must not embed inline scripts."
            echo "$RESULT"
            echo "Use Bitrix Asset::addJs/addCss and documented vendor assets."
            FAIL=1
          elif ! grep -q 'js/metrika.js' local/templates/tacticum/header.php; then
            echo "❌ ERROR: header.php must load Yandex.Metrika through js/metrika.js."
            FAIL=1
          else
            echo "✅ Header has no inline script embeds and loads metrika.js."
          fi

          RESULT=$(grep -nE 'style=' local/templates/tacticum/header.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: header.php must not use inline style attributes."
            echo "$RESULT"
            FAIL=1
          else
            echo "✅ Header has no inline style attributes."
          fi

          RESULT=$(grep -nE "pathname\.includes|document\.querySelectorAll\(\"\.container button\"\)|textContent\.trim\(\)|price-specialist-legacy|modalTemplate\.innerHTML|\.ai-chat-container|\.mt-3 button|button\.textContent|filter-tab\.bg-primary|h3\.section-title \+ \.grid|innerText|querySelector(All)?\([\"']\.(filter-tab|pricing-card|level-select|price-value|level-prices-json)|closest\([\"']\.(order-specialist-btn|pricing-card)" \
            local/templates/tacticum/js/chat-agent.js \
            local/templates/tacticum/js/modal.js \
            local/templates/tacticum/js/scroll.js \
            local/templates/tacticum/components/bitrix/news.list/price/script.js)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Frontend behavior must not depend on URL/text selectors or generate specialist modal HTML in JS."
            echo "$RESULT"
            echo "Use explicit data-* contracts and Bitrix template markup."
            FAIL=1
          else
            echo "✅ Frontend behavior selector discipline checks passed."
          fi

          RESULT=$(grep -nE '\.style\.' \
            local/templates/tacticum/js/forms.js \
            local/templates/tacticum/components/bitrix/news.list/price/script.js)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Form UI state must be represented by CSS classes/selectors, not inline style mutations."
            echo "$RESULT"
            FAIL=1
          else
            echo "✅ Form UI state has no inline style mutations."
          fi

          RESULT=$(grep -nE 'tacticum-personal-offer-form|Получите персональное предложение|specialoffer' \
            index.php \
            calculator/index.php \
            price/index.php \
            contacts/index.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Shared personal offer CTA markup must not be duplicated in public pages."
            echo "$RESULT"
            echo "Use local/templates/tacticum/include/personal-offer-cta.php with page-specific form_id config."
            FAIL=1
          else
            echo "✅ Shared personal offer CTA is include-driven on core public pages."
          fi

          RESULT=$(grep -nE 'Готовы обсудить ваш проект\?|ri-medal-line|bg-white/10 backdrop-blur-sm rounded-xl p-6' \
            about/index.php \
            services/index.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Shared project discussion CTA markup must not be duplicated in public pages."
            echo "$RESULT"
            echo "Use local/templates/tacticum/include/project-discussion-cta.php with page-specific form_id config."
            FAIL=1
          else
            echo "✅ Shared project discussion CTA is include-driven on about/services."
          fi

          RESULT=$(grep -nE '\$_GET|method[[:space:]]*===[[:space:]]*['\''"]GET|elseif.*GET' local/rest/tacticum_prefill.php)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: tacticum_prefill.php must remain POST JSON only."
            echo "$RESULT"
            FAIL=1
          else
            echo "✅ Prefill endpoint is POST-only."
          fi

          if ! grep -qE 'tacticum_rest_require_method\([[:space:]]*['\''"]POST['\''"]|REQUEST_METHOD.*POST' local/rest/tacticum_chat.php; then
            echo "❌ ERROR: tacticum_chat.php must explicitly reject non-POST requests."
            FAIL=1
          else
            echo "✅ Chat endpoint has explicit POST-only method guard."
          fi

          RESULT=$(grep -RInE 'curl_init|curl_exec|curl_errno|CURLOPT_TIMEOUT' local/rest/*.php | grep -v 'local/rest/rest_helpers.php')
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Direct curl usage in /local/rest must go through rest_helpers.php."
            echo "$RESULT"
            FAIL=1
          else
            echo "✅ Direct curl usage is isolated in rest_helpers.php."
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi

      - name: Проверка изменений в bitrix/ (запрещено)
        run: |
          RESULT=$(git diff origin/main...HEAD --name-only -- 'bitrix/' || true)
          if [ -n "$RESULT" ]; then
            echo "❌ ERROR: Changes in bitrix/ are not allowed!"
            echo "$RESULT"
            exit 1
          else
            echo "✅ bitrix/ not modified."
          fi

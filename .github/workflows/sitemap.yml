name: 🗺️ Validate Sitemap

on:
  push:
    paths:
      - 'package.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'offer/sitemap.php'
      - 'tools/static-sitemap-generate.mjs'
      - 'tools/seo-check.mjs'
    branches:
      - main

jobs:
  validate:
    name: Validate XML sitemaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Validate sitemap.xml
        run: xmllint --noout sitemap.xml && echo "✅ sitemap.xml valid"

      - name: Generate and validate static sitemap artifact
        run: |
          STATIC_SITEMAP_LASTMOD="$(TZ=Europe/Moscow date +%F)"
          node ./tools/static-sitemap-generate.mjs --output=/tmp/sitemap-basic-files.xml --lastmod="$STATIC_SITEMAP_LASTMOD"
          node ./tools/static-sitemap-generate.mjs --output=/tmp/sitemap-basic-files.xml --lastmod="$STATIC_SITEMAP_LASTMOD" --check
          xmllint --noout /tmp/sitemap-basic-files.xml

      - name: Validate SEO sitemap governance
        run: npm run seo:check

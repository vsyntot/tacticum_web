name: 🗺️ Validate Sitemap

on:
  push:
    paths:
      - 'package.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'offer/sitemap.php'
      - 'tools/seo-check.mjs'
    branches:
      - main

jobs:
  validate:
    name: Validate XML sitemaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate sitemap.xml
        run: xmllint --noout sitemap.xml && echo "✅ sitemap.xml valid"

      - name: Validate SEO sitemap governance
        run: npm run seo:check

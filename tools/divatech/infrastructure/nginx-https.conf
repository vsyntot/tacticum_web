# Derived from installed BitrixEnv 9 link-site layout; no shared ssl.conf mutation.
server {
    listen 443 ssl;
    server_name divatech.space www.divatech.space;
    include bx/conf/ssl_options.conf;
    ssl_certificate /home/bitrix/dehydrated/certs/divatech.space/fullchain.pem;
    ssl_certificate_key /home/bitrix/dehydrated/certs/divatech.space/privkey.pem;
    ssl_trusted_certificate /home/bitrix/dehydrated/certs/divatech.space/chain.pem;
    access_log /var/log/nginx/divatech.space_access.log main;
    error_log /var/log/nginx/divatech.space_error.log warn;
    server_name_in_redirect off;
    root /home/bitrix/ext_www/divatech.space;
    index index.php;
    set $docroot /home/bitrix/ext_www/divatech.space;
    set $proxyserver http://127.0.0.1:8887;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host:443;
    proxy_set_header HTTPS YES;
    proxy_set_header X-Forwarded-Proto https;
    proxy_ignore_client_abort off;
    include bx/site_settings/divatech.space/*.conf;
    include bx/conf/bitrix.conf;
}

# Divatech, based on installed BitrixEnv 9 / Apache 2.4 link-site template.
<VirtualHost 127.0.0.1:8887>
    ServerName divatech.space
    ServerAlias www.divatech.space
    DocumentRoot /home/bitrix/ext_www/divatech.space
    ErrorLog logs/divatech.space_error_log
    CustomLog logs/divatech.space_access_log combined
    LogLevel warn
    RewriteEngine On
    RewriteCond %{HTTP:HTTPS} =YES
    RewriteRule .* - [E=HTTPS:on,L]

    <Directory />
        Options FollowSymLinks
        AllowOverride None
    </Directory>
    <Directory /home/bitrix/ext_www/divatech.space>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
        php_admin_value session.save_path /tmp/php_sessions/ext_www/divatech.space
        php_admin_value upload_tmp_dir /tmp/php_upload/ext_www/divatech.space
    </Directory>
    # Apache evaluates the real shared target of symlinks as well as the site path.
    <Directory /home/bitrix/www/local>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Directory /home/bitrix/www/bitrix>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <DirectoryMatch "/(\.git|\.svn|\.hg|backup|managed_cache|stack_cache|local_cache)(/|$)">
        Require all denied
    </DirectoryMatch>
    <Directory /home/bitrix/www/bitrix/cache>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /home/bitrix/www/upload>
        AllowOverride None
        php_admin_flag engine off
        Require all denied
    </Directory>
    <Directory /home/bitrix/www/bitrix/images>
        AllowOverride None
        php_admin_flag engine off
    </Directory>
    <Directory /home/bitrix/www/bitrix/tmp>
        AllowOverride None
        php_admin_flag engine off
        Require all denied
    </Directory>
    <FilesMatch "^(\.settings.*\.php|dbconn\.php|\.access\.php|\.section\.php|tacticum_config\.php)$">
        Require all denied
    </FilesMatch>
</VirtualHost>

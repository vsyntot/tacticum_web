# Initial closed phase: ACME works before a Divatech TLS certificate exists.
server {
    listen 80;
    server_name divatech.space www.divatech.space;
    access_log /var/log/nginx/divatech.space_access.log main;
    error_log /var/log/nginx/divatech.space_error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/dehydrated/;
        default_type text/plain;
    }
    location / { return 503; }
}

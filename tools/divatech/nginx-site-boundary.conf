# Candidate for /etc/nginx/bx/site_settings/divatech.space/20-site-boundary.conf.
# Included inside both BitrixEnv-managed HTTP and HTTPS server blocks.
# Validate against the installed bitrix.conf before activation.
if ($host = www.divatech.space) { return 301 https://divatech.space$request_uri; }
location = / { proxy_pass $proxyserver; }
location = /index.php { return 301 https://divatech.space/$is_args$args; }

location = /page28604425.html { return 301 https://divatech.space/$is_args$args; }
location = /files/page28604425body.html { return 301 https://divatech.space/$is_args$args; }

# BitrixEnv maps bare 404 responses to its application fallback.
# Route boundary denials to a terminal named location instead.
location @divatech_denied { return 403; }

# Shared PHP API/services from s1 must not become public through the local/ symlink.
location = /local/rest/divatech_lead.php {
    client_max_body_size 16k;
    proxy_pass $proxyserver;
}
location ^~ /local/templates/divatech/assets/ {
    error_page 403 404 = @divatech_denied;
    if ($uri !~ "^/local/templates/divatech/assets/[a-z0-9-]+\.(svg|png|jpg|ico)$") { return 403; }
    try_files $uri =404;
}
location = /local/templates/divatech/style.css { error_page 403 404 = @divatech_denied; try_files $uri =404; }
location = /local/templates/divatech/script.js { error_page 403 404 = @divatech_denied; try_files $uri =404; }
location ^~ /local/ { error_page 403 404 = @divatech_denied; return 403; }
location ^~ /upload/ { error_page 403 404 = @divatech_denied; return 403; }
location = /local { error_page 403 404 = @divatech_denied; return 403; }
location = /upload { error_page 403 404 = @divatech_denied; return 403; }

# Admin uses the existing Tacticum administrative host; do not create a second entry point.
# Preserve the requested admin path and query string so bookmarks and deep links continue to work.
location = /bitrix/admin { return 301 https://tacticum.ru/bitrix/admin$is_args$args; }
location ^~ /bitrix/admin/ { return 301 https://tacticum.ru$request_uri; }
location = /.access.php { error_page 403 404 = @divatech_denied; return 403; }
location = /.section.php { error_page 403 404 = @divatech_denied; return 403; }
location = /urlrewrite.php { error_page 403 404 = @divatech_denied; return 403; }
